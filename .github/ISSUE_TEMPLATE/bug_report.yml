name: Bug report
description: Report a reproducible software defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please remove sensitive data and provide the smallest reproducible example.

  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command, input identifier and traceback.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NucleoScan version or commit
      placeholder: v1.1.0 or a full commit SHA
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, GPU, CUDA, PyTorch and ESMFold versions.
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression
      options:
        - Unknown
        - Yes, this worked in an earlier version
        - No, this is the first version tested
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: This report does not contain a security vulnerability.
          required: true
